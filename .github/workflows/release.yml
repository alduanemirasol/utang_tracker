name: Release Android APKs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: utang-tracker
  RELEASE_DIR: release-assets
  RELEASE_NOTES_JSON: assets/release_notes/current.json
  TAG_NAME: ${{ github.ref_name }}

jobs:
  release:
    name: Validate, build, and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify app and release versions
        run: bash .github/scripts/verify-version.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure Android signing
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash .github/scripts/configure-signing.sh

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare release files
        run: bash .github/scripts/prepare-release.sh

      - name: Generate release notes
        run: bash .github/scripts/generate-release-notes.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*.apk
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false